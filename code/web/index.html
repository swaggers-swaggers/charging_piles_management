<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>东软电动汽车充电桩管理平台 - 大数据可视化大屏</title>
<script>
// 防呆: 检测是否以"文件方式"(file://, 即双击 index.html)打开 —— 这种方式浏览器会拦截数据请求
if (window.location.protocol === 'file:') {
  document.write(
    '<div style="position:fixed;inset:0;background:#7A1F1F;color:#fff;display:flex;' +
    'flex-direction:column;align-items:center;justify-content:center;' +
    'font-family:sans-serif;text-align:center;padding:40px;z-index:99999;">' +
    '<h1 style="font-size:34px;margin-bottom:20px;">❌ 当前是【双击文件】方式打开的，不会有数据</h1>' +
    '<p style="font-size:20px;line-height:1.9;">请<b style="color:#FFD76A;">先启动服务端 ChargingServer</b>，' +
    '然后在浏览器地址栏输入：</p>' +
    '<p style="font-size:28px;font-weight:bold;background:#00000055;padding:12px 30px;border-radius:8px;margin:16px 0;">' +
    'http://localhost:8080</p>' +
    '<p style="font-size:17px;color:#FFD0D0;">（或把 localhost 换成服务器的 IP，例如 http://192.168.x.x:8080）</p>' +
    '</div>');
}
</script>
<script src="echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; overflow: auto;
               background: #F3F7F6; color: #243E33;
               font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #screen { display: flex; flex-direction: column; width: 100%; min-height: 100vh; padding: 24px; max-width: 1800px; margin: auto; }

  #header { min-height: 76px; gap: 16px; display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(90deg, #FFFFFF, #EDF7F0, #FFFFFF);
            border: 1px solid #DCE8DF; border-radius: 8px; padding: 0 24px; }
  #header h1 { font-size: 26px; letter-spacing: 1px; color: #173E33; }
  #header h1 span { color: #237653; }
  #updated { font-size: 13px; color: #667C73; }

  #metrics { display: flex; gap: 16px; margin: 12px 0; }
  .metric { flex: 1; height: 96px; background: #FFFFFF; border: 1px solid #DCE8DF;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; }
  .metric .label { font-size: 14px; color: #667C73; margin-bottom: 8px; }
  .metric .value { font-size: 32px; font-weight: bold; color: #237653; }
  .metric.green .value { color: #368D69; }
  .metric.orange .value { color: #B7802B; }

  #charts { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            grid-template-rows: repeat(2, minmax(280px, 1fr)); gap: 14px; min-height: 0; }
  .panel { background: #FFFFFF; border: 1px solid #DCE8DF; border-radius: 8px;
           display: flex; flex-direction: column; padding: 10px 14px; min-height: 0; }
  .panel h3 { font-size: 15px; color: #345C47; margin: 2px 0 6px; }
  .chart { flex: 1; min-height: 240px; min-width: 0; }
  .metric, .panel { box-shadow: 0 4px 20px rgba(24, 65, 44, .035); border-radius: 14px; }
  .panel { min-width: 0; padding: 18px; }
  #header h1 { font-size: clamp(18px, 2vw, 26px); }
  #updated { line-height: 1.6; }
  @media (max-width: 900px) {
    #header { flex-direction: column; align-items: flex-start; padding: 18px; }
    #metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
    #charts { grid-template-columns: minmax(0,1fr); grid-template-rows: none; }
    #screen { padding: 12px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .metric { transition: transform .18s ease; }
    .metric:hover { transform: translateY(-3px); }
  }
</style>
</head>
<body>
<div id="screen">
  <div id="header">
    <h1>⚡ 东软电动汽车充电桩 <span>运营数据总览</span></h1>
    <div id="updated">等待数据...</div>
  </div>

  <div id="metrics">
    <div class="metric"><div class="label">今日营收 (元)</div><div class="value" id="mToday">--</div></div>
    <div class="metric green"><div class="label">本月营收 (元)</div><div class="value" id="mMonth">--</div></div>
    <div class="metric orange"><div class="label">总营收 (元)</div><div class="value" id="mTotal">--</div></div>
    <div class="metric"><div class="label">预计高峰时段</div><div class="value" id="mPeak">--</div></div>
  </div>

  <div id="charts">
    <div class="panel"><h3>近7日营收趋势 (元)</h3><div class="chart" id="chartTrend"></div></div>
    <div class="panel"><h3>电桩状态分布</h3><div class="chart" id="chartPile"></div></div>
    <div class="panel"><h3>各充电站累计营收 (元)</h3><div class="chart" id="chartStation"></div></div>
    <div class="panel"><h3>未来24小时充电负荷预测 (kWh) —— 机器学习子系统</h3><div class="chart" id="chartPredict"></div></div>
  </div>
</div>

<script>
const charts = {};
function initCharts() {
  if (typeof echarts === 'undefined') {
    document.getElementById('updated').textContent =
        'ECharts 加载失败, 请检查 echarts.min.js 是否可访问';
    return false;
  }
  charts.trend = echarts.init(document.getElementById('chartTrend'));
  charts.pile = echarts.init(document.getElementById('chartPile'));
  charts.station = echarts.init(document.getElementById('chartStation'));
  charts.predict = echarts.init(document.getElementById('chartPredict'));
  return true;
}

function render(data) {
  if (!data || !data.metrics || !data.daily7 || !data.pileStatus ||
      !data.stationRevenue || !data.predict) {
    document.getElementById('updated').textContent = '数据格式异常, 请检查服务端 data.json';
    return;
  }
  document.getElementById('updated').textContent =
      '数据更新时间: ' + data.updated + '  (每5秒自动刷新)';
  document.getElementById('mToday').textContent = data.metrics.today.toFixed(2);
  document.getElementById('mMonth').textContent = data.metrics.month.toFixed(2);
  document.getElementById('mTotal').textContent = data.metrics.total.toFixed(2);
  document.getElementById('mPeak').textContent = data.predict.peakHour + ' 时';

  charts.trend.setOption({
    backgroundColor: '#FFFFFF',
    tooltip: { trigger: 'axis' },
    grid: { left: 12, right: 20, top: 20, bottom: 12, containLabel: true },
    xAxis: { type: 'category', data: data.daily7.dates,
             axisLine: { lineStyle: { color: '#B9CDC0' } }, axisLabel: { color: '#667C73' } },
    yAxis: { type: 'value', axisLabel: { color: '#667C73' },
             splitLine: { lineStyle: { color: '#E4EEE7' } } },
    series: [{ type: 'line', smooth: true, data: data.daily7.values,
               areaStyle: { color: 'rgba(35,118,83,0.12)' },
               lineStyle: { color: '#237653', width: 2 },
               itemStyle: { color: '#237653' } }]
  });

  charts.pile.setOption({
    backgroundColor: '#FFFFFF',
    tooltip: { trigger: 'item', formatter: '{b}: {c} 台 ({d}%)' },
    legend: { bottom: 0, textStyle: { color: '#667C73' } },
    series: [{ type: 'pie', radius: ['38%', '62%'], center: ['50%', '46%'],
               label: { color: '#345C47' },
               data: [
                 { value: data.pileStatus.idle, name: '闲置', itemStyle: { color: '#368D69' } },
                 { value: data.pileStatus.inUse, name: '在用', itemStyle: { color: '#237653' } },
                 { value: data.pileStatus.fault, name: '故障', itemStyle: { color: '#C5525A' } }
               ] }]
  });

  charts.station.setOption({
    backgroundColor: '#FFFFFF',
    tooltip: { trigger: 'axis' },
    grid: { left: 12, right: 20, top: 20, bottom: 12, containLabel: true },
    xAxis: { type: 'category', data: data.stationRevenue.names,
             axisLine: { lineStyle: { color: '#B9CDC0' } }, axisLabel: { color: '#667C73' } },
    yAxis: { type: 'value', axisLabel: { color: '#667C73' },
             splitLine: { lineStyle: { color: '#E4EEE7' } } },
    series: [{ type: 'bar', barWidth: '45%', data: data.stationRevenue.values,
               itemStyle: { color: '#B7802B', borderRadius: [4, 4, 0, 0] } }]
  });

  charts.predict.setOption({
    backgroundColor: '#FFFFFF',
    tooltip: { trigger: 'axis' },
    grid: { left: 12, right: 20, top: 20, bottom: 12, containLabel: true },
    xAxis: { type: 'category', data: data.predict.hours, boundaryGap: false,
             axisLine: { lineStyle: { color: '#B9CDC0' } },
             axisLabel: { color: '#667C73', interval: 3 } },
    yAxis: { type: 'value', axisLabel: { color: '#667C73' },
             splitLine: { lineStyle: { color: '#E4EEE7' } } },
    series: [{ type: 'line', smooth: true, data: data.predict.loads,
               areaStyle: { color: 'rgba(54,141,105,0.12)' },
               lineStyle: { color: '#368D69', width: 2 },
               itemStyle: { color: '#368D69' },
               markPoint: { data: [{ type: 'max', name: '高峰' }],
                            itemStyle: { color: '#C5525A' } } }]
  });
}

function resizeAll() {
  Object.values(charts).forEach(c => c.resize());
}

async function poll() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (resp.ok) {
      render(await resp.json());
    } else {
      document.getElementById('updated').textContent = '服务端返回 HTTP ' + resp.status;
    }
  } catch (e) {
    document.getElementById('updated').textContent =
        '等待服务端数据... (请确认 ChargingServer 正在运行, 且以 http 方式打开本页)';
  } finally {
    setTimeout(poll, 5000);
  }
}

if (initCharts()) {
  poll();
}
window.addEventListener('resize', resizeAll);
</script>
</body>
</html>
